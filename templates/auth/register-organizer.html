{% extends "base.html" %}

{% block title %}Become an Organizer{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Become a Tournament Organizer</h1>

        <p>
            Submit a request to become an approved tournament organizer.
            Your request will be reviewed by the administrator.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="organization">
                    Organization / College
                </label>

                <input
                    type="text"
                    id="organization"
                    name="organization"
                    required
                >
            </div>

            <div class="form-group">
                <label for="reason">
                    Why do you want to organize tournaments?
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit">
                Submit Organizer Request
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
